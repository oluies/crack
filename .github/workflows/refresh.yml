name: Data refresh and deploy

on:
  schedule:
    # Wednesdays 22:00 UTC — after both EIA release calendars, not before them.
    #
    # The previous slot, Tuesdays 06:00, was chosen on the assumption that the
    # Oil Bulletin and EIA's retail series both land on Monday. Neither does, and
    # EIA states its own cadence on the series pages:
    #
    #   weekly retail (pet_pri_gnd)  released Tue 2026-08-18, next Tue 2026-08-25
    #   daily spot    (pet_pri_spt)  released Wed 2026-08-19, next Wed 2026-08-26
    #
    # Spot is a weekly release too: the Wednesday drop carries through the prior
    # Tuesday. So Tuesday 06:00 sampled both at their stalest — hours before that
    # day's retail release and a day before the spot release — and the run
    # fetched last week's data, verified it green, found every export
    # byte-identical and committed nothing. The site sat a week behind while CI
    # stayed green about it.
    #
    # The EU bulletin is deliberately NOT part of that claim: it has no published
    # release time. Observed, it lands somewhere Monday to Wednesday, and the
    # 2026-08-24 survey week was still absent at Tuesday 13:00 UTC. This slot
    # usually catches it and is not guaranteed to.
    #
    # 22:00 UTC is 18:00 US Eastern in summer and 17:00 in winter — the offset is
    # seasonal, the cron is not, so the margin is sized for the winter figure.
    # Missing that margin costs a full week, so it is spent here rather than in a
    # retry: this job cannot tell that it ran too early, only that nothing moved,
    # which is what the warning in the commit step is for — with the limits noted
    # there.
    - cron: '0 22 * * 3'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'build.mill'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write      # commit refreshed JSON
  pages: write         # deploy
  id-token: write      # deploy-pages OIDC

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Refresh data and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
            out
          key: mill-${{ runner.os }}-${{ hashFiles('build.mill', 'site/app/src/**') }}
          restore-keys: mill-${{ runner.os }}-

      - name: Install DuckDB CLI
        run: |
          curl -sL https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip -o duckdb.zip
          unzip -q duckdb.zip && sudo mv duckdb /usr/local/bin/ && duckdb --version

      # Only on the scheduled/manual path. A push to site/ redeploys the existing
      # data rather than spending an API round trip to rebuild it unchanged.
      - name: Refresh data
        if: github.event_name != 'push'
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: pipeline/run.sh

      # run.sh restores a file whose only change was the refresh timestamp, so
      # an unchanged upstream leaves no diff here and nothing is committed.
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/public/data
          if git diff --cached --quiet -- site/public/data; then
            # Villkoret ovan jämför HELA site/public/data. Noll ändringar är
            # alltså "ingen källa flyttade sig" — normalt på en manuell körning,
            # avvikande på en schemalagd, eftersom slottet ligger efter båda
            # EIA-släppen. Tystnaden här lät ett felställt schema gå oupptäckt:
            # grön körning varje vecka, gammal data, ingenting sagt.
            #
            # Varning, inte exit 1: EU-bulletinen har ingen utlovad släpptid och
            # kan legitimt vara sen, och ett rött jobb skulle stoppa deployen av
            # data som är i sin ordning. Vid en total stiltje blir det ändå rött
            # efter ungefär tre veckor: verify 16 fäller när dagsserien är 20
            # dagar gammal — tredje körningen efter stoppet, då lagget gått 1, 8,
            # 15, 22. 7b:s 14 dagar mäts mellan veckostarter, växer i
            # sjudagarssteg och slår till först vid 21: senare, inte tidigare.
            #
            # Vad raden INTE täcker, och det är avsiktligt kvar som ett hål:
            #   - En enskild stannad serie, om den bevakas per serie. EU-retail
            #     (7b) och US retail (7c, per bränsle) är det, och då fäller
            #     Refresh data — det här steget körs aldrig, det har inget
            #     if: always(). Saknas den granulariteten passerar stoppet tyst
            #     här i stället: övriga serier rör sig, diffen är icke-tom, och
            #     else-grenen committar som vanligt. Så var det för US retail
            #     fram till 2026-08-25.
            #   - En enskild stannad SPOT-serie. Verify 16 tar ett tabellbrett
            #     max över tre series_key, så stannar RWTC ensam håller de andra
            #     kontrollen färsk och jobbet blir aldrig rött. Se GRÄNS-noten
            #     vid check 16.
            #   - Regionserierna. De hämtas i en egen förfrågan och har ingen
            #     egen färskhetskontroll: 7c ser dem bara i den mån de stannar
            #     samtidigt som de nationella serierna. Se noten vid 7c.
            #   - Notifiering. Varningen syns för den som öppnar körningen.
            #     Röda körningar mejlas däremot ut, vilket är den starkare
            #     signalen. För publika repon (detta är ett) stänger GitHub av
            #     schemalagda triggers efter 60 dagar utan aktivitet i repot, som
            #     varken en varning eller ett rött jobb skapar — men klockan
            #     nollställs av vilken repoaktivitet som helst, mänskliga commits
            #     inkluderade, ett mejl går ut före avstängningen och triggern
            #     slås på igen för hand i Actions-fliken.
            #
            # Ett larm som täcker hålen är ett öppet beslut, inte en glömska: en
            # rad till repot håller schemat vid liv men bryter mot regeln att en
            # refresh utan diff inte committar (constitution.md, spec.md:s FR-020,
            # Independent Test och acceptansscenario 2, tasks.md) — en amendment.
            # Ett issue notifierar men håller inte schemat vid liv och kräver
            # issues: write plus GH_TOKEN i steget. Princip V berörs av ingendera:
            # den binder run.sh:s utdata, inte vad workflowet skriver bredvid.
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then
              echo "::warning::Schemalagd refresh gav noll dataändringar. Kontrollera"\
                   "EIA:s och kommissionens släppkalendrar mot cron-slotten i den här"\
                   "filen innan du misstänker hämtningen."
            else
              echo "Inga dataändringar – hoppar commit."
            fi
          else
            git commit -m "data refresh $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      # The push path skips the refresh and deploys whatever JSON is committed.
      # If those files are absent the deploy would publish a site that renders
      # nothing but the "could not load the published data" banner, so fail here
      # instead of shipping it.
      # Listan härleds ur 50_export.sql:s COPY-mål via samma skript som
      # check-export-paths.sh använder, inte ur en egen uppräkning. Den här
      # listan hann sakna både usregions.json och cracks_daily.json innan
      # någon märkte det, och en andra handhållen kopia hade gått isär igen.
      - name: Ensure published data exists
        run: |
          targets=$(pipeline/export-targets.sh pipeline/50_export.sql)
          missing=0
          for f in $targets; do
            if [ ! -s "$f" ]; then
              echo "FEL: $f saknas eller är tom"; missing=1
            else
              echo "$f: $(wc -c < "$f") byte"
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Deployen skulle publicera en sida utan data. Kör workflow_dispatch"
            echo "(som hämtar data) eller committa datafilerna först."
            exit 1
          fi

      - name: Link the frontend
        run: ./mill site.bundleFull

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
